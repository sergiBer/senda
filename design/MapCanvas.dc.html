<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div ref="{{ rootRef }}" style="position:absolute;inset:0;overflow:hidden;background:#EEE9DF;font-family:'Figtree',sans-serif;user-select:none">
  <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="0">
    <img src="{{ t.url }}" alt="" draggable="false" style="position:absolute;left:{{ t.x }}px;top:{{ t.y }}px;width:256px;height:256px;pointer-events:none;filter:{{ t.filter }}">
  </sc-for>
  <sc-if value="{{ isBase }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;background:#F1E6D2;mix-blend-mode:multiply;opacity:0.32;pointer-events:none"></div>
  </sc-if>
  <sc-for list="{{ clusters }}" as="c" hint-placeholder-count="0">
    <div style="position:absolute;left:{{ c.x }}px;top:{{ c.y }}px;transform:translate(-50%,-50%);width:{{ c.s }}px;height:{{ c.s }}px;border-radius:50%;background:rgba(46,90,76,0.2);display:flex;align-items:center;justify-content:center;z-index:1">
      <div style="width:{{ c.si }}px;height:{{ c.si }}px;border-radius:50%;background:#2E5A4C;border:2px solid #fff;box-sizing:border-box;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center">{{ c.n }}</div>
    </div>
  </sc-for>
  <sc-for list="{{ markers }}" as="m" hint-placeholder-count="0">
    <div onClick="{{ m.onClick }}" style="position:absolute;left:{{ m.x }}px;top:{{ m.y }}px;transform:{{ m.tf }};z-index:{{ m.z }};cursor:pointer">
      <sc-if value="{{ m.plain }}">
        <div style="width:{{ m.size }}px;height:{{ m.size }}px;border-radius:50%;background:{{ m.color }};border:2px solid #fff;box-sizing:border-box;box-shadow:0 2px 6px rgba(31,29,26,0.3);display:flex;align-items:center;justify-content:center;color:#fff">
          <span class="material-symbols-rounded" style="font-size:{{ m.isz }}px">{{ m.glyph }}</span>
        </div>
      </sc-if>
      <sc-if value="{{ m.sel }}">
        <div style="display:flex;flex-direction:column;align-items:center">
          <div style="display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:#1F1D1A;color:#fff;box-shadow:0 6px 16px rgba(31,29,26,0.3);white-space:nowrap">
            <div style="width:28px;height:28px;border-radius:50%;background:{{ m.color }};display:flex;align-items:center;justify-content:center"><span class="material-symbols-rounded" style="font-size:16px">{{ m.glyph }}</span></div>
            <span style="font-weight:600;font-size:13px">{{ m.name }}</span>
            <span style="display:flex;align-items:center;gap:2px;font-weight:600;font-size:13px;color:#F2C98A"><span class="material-symbols-rounded" style="font-size:15px;font-variation-settings:'FILL' 1">star</span>{{ m.rating }}</span>
          </div>
          <div style="width:2px;height:8px;background:#1F1D1A"></div>
          <div style="width:14px;height:14px;border-radius:50%;background:{{ m.color }};border:2px solid #fff;box-sizing:border-box;box-shadow:0 0 0 4px rgba(31,29,26,0.15)"></div>
        </div>
      </sc-if>
    </div>
  </sc-for>
  <sc-if value="{{ hasUser }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:{{ ux }}px;top:{{ uy }}px;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(47,111,214,0.16);display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none">
      <div style="width:16px;height:16px;border-radius:50%;background:#2F6FD6;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.3)"></div>
    </div>
  </sc-if>
  <sc-if value="{{ showAttr }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;right:0;bottom:0;padding:2px 8px;background:rgba(255,254,251,0.85);font-size:10.5px;color:#57514A;border-top-left-radius:6px;z-index:6">{{ attrText }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:600},&quot;zoom&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:13,&quot;tsType&quot;:&quot;number&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;joanmiro&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;clusters&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;user&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;only&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;centerOn&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;panX&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;panY&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;layer&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;base&quot;,&quot;ortho&quot;],&quot;default&quot;:&quot;base&quot;,&quot;tsType&quot;:&quot;'base'|'ortho'&quot;},&quot;hideAttribution&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;}}">
const CATS = { jue: { c: '#B45F3E', i: 'extension' }, nat: { c: '#3E7656', i: 'forest' }, cul: { c: '#4C6A98', i: 'museum' }, otr: { c: '#8A7535', i: 'family_restroom' } };
const PL = [
  { id: 'ciutadella', name: 'Parc de la Ciutadella', cat: 'nat', lat: 41.3881, lon: 2.1873, r: '4,6' },
  { id: 'laberint', name: "Laberint d'Horta", cat: 'nat', lat: 41.4398, lon: 2.1460, r: '4,6' },
  { id: 'cosmo', name: 'CosmoCaixa', cat: 'cul', lat: 41.4134, lon: 2.1316, r: '4,7' },
  { id: 'santantoni', name: 'Biblioteca Sant Antoni', cat: 'cul', lat: 41.3792, lon: 2.1601, r: '4,8' },
  { id: 'icaria', name: 'Platja de la Nova Icària', cat: 'nat', lat: 41.3906, lon: 2.2030, r: '4,2' },
  { id: 'joanmiro', name: 'Parc de Joan Miró', cat: 'jue', lat: 41.3776, lon: 2.1490, r: '4,5' },
  { id: 'oreneta', name: "Parc de l'Oreneta", cat: 'jue', lat: 41.4007, lon: 2.1104, r: '4,7' },
  { id: 'putxet', name: 'Turó del Putxet', cat: 'nat', lat: 41.4058, lon: 2.1424, r: '4,4' },
  { id: 'diagonalmar', name: 'Parc de Diagonal Mar', cat: 'jue', lat: 41.4085, lon: 2.2135, r: '4,3' },
  { id: 'museublau', name: 'Museu Blau', cat: 'cul', lat: 41.4111, lon: 2.2215, r: '4,6' },
  { id: 'clot', name: 'Parc del Clot', cat: 'jue', lat: 41.4096, lon: 2.1880, r: '4,1' },
  { id: 'ludo', name: 'Ludoteca El Drac', cat: 'jue', lat: 41.4030, lon: 2.1760, r: '4,9' },
  { id: 'budellera', name: 'Font de la Budellera', cat: 'nat', lat: 41.4230, lon: 2.1078, r: '4,4' },
  { id: 'brossa', name: 'Jardins de Joan Brossa', cat: 'jue', lat: 41.3700, lon: 2.1650, r: '4,5' },
  { id: 'espaifam', name: 'Espai Familiar Gràcia', cat: 'otr', lat: 41.4020, lon: 2.1560, r: '4,6' },
  { id: 'fuster', name: 'Biblioteca Jaume Fuster', cat: 'cul', lat: 41.4085, lon: 2.1517, r: '4,5' },
  { id: 'espanya', name: "Parc de l'Espanya Industrial", cat: 'jue', lat: 41.3771, lon: 2.1410, r: '4,3' },
  { id: 'laribal', name: 'Jardins de Laribal', cat: 'nat', lat: 41.3712, lon: 2.1560, r: '4,4' },
  { id: 'casal', name: 'Casal Infantil Poble-sec', cat: 'otr', lat: 41.3735, lon: 2.1640, r: '4,5' }
];
const CL = [[41.4300, 2.1800, 18], [41.3650, 2.1250, 9], [41.4420, 2.1950, 24], [41.4500, 2.1050, 7], [41.3930, 2.1290, 5], [41.3600, 2.1550, 6], [41.4200, 2.1600, 11]];

class Component extends DCLogic {
  state = { w: 1200, h: 800 };
  rootRef = React.createRef();
  componentDidMount() {
    const el = this.rootRef.current;
    if (!el) return;
    const upd = () => this.setState({ w: el.clientWidth || 1200, h: el.clientHeight || 800 });
    upd();
    this.ro = new ResizeObserver(upd);
    this.ro.observe(el);
  }
  componentWillUnmount() { this.ro && this.ro.disconnect(); }
  renderVals() {
    const p = this.props, z = p.zoom ?? 13, comp = !!p.compact, S = 256 * Math.pow(2, z);
    const proj = (la, lo) => { const r = la * Math.PI / 180; return [S * (lo + 180) / 360, S * (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2]; };
    const co = p.centerOn && PL.find(x => x.id === p.centerOn);
    let c = co ? proj(co.lat, co.lon) : proj(41.3874, 2.1686);
    c = [c[0] + (p.panX ?? 0), c[1] + (p.panY ?? 0)];
    const W = this.state.w, H = this.state.h, ox = W / 2 - c[0], oy = H / 2 - c[1];
    const tiles = [], ortho = p.layer === 'ortho';
    for (let tx = Math.floor((c[0] - W / 2) / 256); tx <= Math.floor((c[0] + W / 2) / 256); tx++)
      for (let ty = Math.floor((c[1] - H / 2) / 256); ty <= Math.floor((c[1] + H / 2) / 256); ty++)
        tiles.push({ url: ortho ? `https://geoserveis.icgc.cat/icc_mapesmultibase/noutm/wmts/orto/GRID3857/${z}/${tx}/${ty}.jpeg` : `https://tile.openstreetmap.org/${z}/${tx}/${ty}.png`, filter: ortho ? 'none' : 'saturate(0.4) contrast(0.82) brightness(1.1)', x: Math.round(tx * 256 + ox), y: Math.round(ty * 256 + oy) });
    const only = p.only ? String(p.only).split(',') : null;
    const inb = (x, y) => x > -80 && x < W + 80 && y > -80 && y < H + 80;
    const markers = PL.filter(m => !only || only.includes(m.id)).map(m => {
      const [X, Y] = proj(m.lat, m.lon), k = CATS[m.cat], sel = m.id === p.selected;
      return { x: Math.round(X + ox), y: Math.round(Y + oy), sel, plain: !sel, color: k.c, glyph: k.i, size: comp ? 28 : 32, isz: comp ? 15 : 17, name: m.name, rating: m.r,
        tf: sel ? 'translate(-50%, calc(-100% + 7px))' : 'translate(-50%,-50%)', z: sel ? 5 : 2, onClick: p.onSelect ? () => p.onSelect(m.id) : undefined };
    }).filter(m => inb(m.x, m.y));
    const clusters = p.clusters ? CL.map(([la, lo, n]) => { const [X, Y] = proj(la, lo); const s = n > 15 ? 52 : n > 8 ? 46 : 40; return { x: Math.round(X + ox), y: Math.round(Y + oy), n, s, si: s - 12 }; }).filter(m => inb(m.x, m.y)) : [];
    const [UX, UY] = proj(41.3822, 2.1652);
    return { rootRef: this.rootRef, tiles, markers, clusters, hasUser: !!p.user, ux: Math.round(UX + ox), uy: Math.round(UY + oy), showAttr: !p.hideAttribution, isBase: !ortho, attrText: ortho ? 'Ortofoto: © Institut Cartogràfic i Geològic de Catalunya (ICGC)' : '© colaboradores de OpenStreetMap' };
  }
}
</script>
</body>
</html>
