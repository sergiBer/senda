# Puertas de calidad en CI (HAR-07). El job del frontend se añade con la spec 001.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: senda
          POSTGRES_USER: senda
          POSTGRES_PASSWORD: senda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U senda -d senda"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Librerías geoespaciales
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libproj-dev
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - run: pytest -q
