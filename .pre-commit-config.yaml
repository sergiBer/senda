# Puertas de calidad locales (HAR-07). Instalar: pip install pre-commit && pre-commit install
# Los hooks del frontend (ESLint, tsc, Vitest) se añaden con la spec 001.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: pytest-backend
        name: pytest (backend, en Docker)
        entry: docker compose exec -T backend pytest -q
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
